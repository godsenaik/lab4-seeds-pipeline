name: Seeds ML CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-train-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dataset
        run: python src/validate_data.py

      - name: Train model and enforce quality gate
        run: python src/train_model.py

      - name: Run application tests
        run: python -m pytest tests -v

      - name: Package model and reports
        if: success()
        run: |
          mkdir -p release
          cp artifacts/seeds_model.joblib release/
          cp artifacts/metrics.json release/
          cp requirements.txt release/
          cp src/validate_data.py release/
          cp src/train_model.py release/
          cp tests/test_model.py release/
          printf "import joblib\nmodel = joblib.load('seeds_model.joblib')\nprint('Model loaded successfully')\n" > release/predict.py
          echo "Commit: $GITHUB_SHA" > release/build_info.txt
          echo "Run: $GITHUB_RUN_NUMBER" >> release/build_info.txt

      - name: Upload successful pipeline artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seeds-ml-package-run-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30
